# Checks the team's setup and Houston's core on every push and pull request.
name: houston

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # The same Bun that built the vendored editor bundle, so the rebuild check is byte for byte.
          bun-version-file: .houston/.bun-version

      - name: Validate houston.yml and cadences
        # The template has no houston.yml yet; "set me up" writes it.
        if: hashFiles('houston.yml') != ''
        run: .houston/bin/houston validate

      - name: Test and typecheck the core
        working-directory: .houston
        run: bun install --frozen-lockfile && bun test && bunx tsc --noEmit -p .
