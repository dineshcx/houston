<!doctype html>
<!-- Houston's local app: one page, hash-routed screens rendered by js/app.js. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Houston</title>
    <link rel="icon" href="data:," />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="modulepreload" href="/js/ui.js" />
    <link rel="modulepreload" href="/js/api.js" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="app" id="app">
      <nav class="side" aria-label="Houston">
        <div class="side-inner" id="side"></div>
        <div class="resizer" data-resize="side" title="Drag to resize, double-click to reset"></div>
      </nav>
      <main class="main" id="main" tabindex="-1"></main>
      <aside class="detail" id="detail" aria-label="Issue" hidden>
        <div class="resizer" data-resize="detail" title="Drag to resize, double-click to reset"></div>
        <div class="detail-body" id="detail-body"></div>
      </aside>
    </div>
    <div class="detail-scrim" id="detail-scrim" hidden></div>
    <div id="flash" aria-live="assertive"></div>
    <div id="overlay"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
